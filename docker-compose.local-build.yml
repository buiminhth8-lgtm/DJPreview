services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: ai-music-mvp-api:local
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-}
      AUDIO_RENDERER: ${AUDIO_RENDERER:-fallback}
      SOUNDFONT_PATH: ${SOUNDFONT_PATH:-}
      AUDIO_SAMPLE_RATE: ${AUDIO_SAMPLE_RATE:-44100}
      AUDIO_GAIN: ${AUDIO_GAIN:-0.6}
      PROJECTS_DIR: /app/data/projects
    volumes:
      - runtime-data:/app/data
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        VITE_API_BASE_URL: ""
    image: ai-music-mvp-web:local
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  runtime-data:
